services:
  api:
    build: .
    image: tender-collector-api:1.0.0
    container_name: tender-collector-api
    ports:
      - "8000:8000"
    environment:
      # 容器内部通过服务名访问示例站点；演示页默认值会同步使用这两个地址
      SAMPLE_SITE_URL: http://sample-site
      SAMPLE_LIST_URL: http://sample-site/list.html
      SAMPLE_OUTAGE_LIST_URL: http://sample-site/outage/list.html
    depends_on:
      sample-site:
        condition: service_healthy
    restart: unless-stopped

  sample-site:
    image: nginx:1.27-alpine
    container_name: tender-sample-site
    ports:
      - "8080:80"
    volumes:
      - ./sample-site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/list.html"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
